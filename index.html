<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos das letras */
    .correct { background-color: #538d4e !important; color: white !important; border-color: #538d4e !important; }
    .present { background-color: #b59f3b !important; color: white !important; border-color: #b59f3b !important; }
    .absent { background-color: #3a3a3c !important; color: white !important; border-color: #3a3a3c !important; }

    /* Grid responsivo */
    #board-grid {
      display: grid;
      gap: 6px;
      justify-content: center;
      align-content: center;
      margin: 0 auto;
    }

    .tile {
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .tile-front, .tile-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
      transition: all 0.2s ease;
    }

    /* Borda ativa da célula atual */
    .tile-active {
      border-color: #818cf8 !important;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.5);
    }

    /* Input invisível para acionar o teclado no mobile */
    #native-keyboard-input {
      position: absolute;
      opacity: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }

    .animate-pop {
      animation: modalPop 0.15s ease-in-out;
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-zinc-950 text-white h-screen overflow-hidden flex flex-col justify-between">

  <main class="w-full h-full max-w-md mx-auto p-3 flex flex-col justify-between items-center relative">
    
    <!-- TELA GAMEPLAY GRID -->
    <div id="game-screen" class="w-full h-full flex flex-col justify-between items-center py-2 relative" onclick="focusNativeKeyboard()">
      
      <!-- Top Info Bar -->
      <div class="w-full shrink-0 flex justify-between items-center bg-zinc-900/90 px-4 py-2.5 rounded-xl border border-zinc-800 mb-2 shadow-md z-20">
        <div class="flex flex-col items-start gap-0.5">
          <div id="p1-game-info" class="text-xs font-bold text-zinc-300">P1: 0 pts</div>
          <div id="p2-game-info" class="text-xs font-bold text-zinc-300">P2: 0 pts</div>
        </div>

        <div class="text-right">
          <span class="text-[10px] text-zinc-400 uppercase font-semibold block">Tentando Adivinhar</span>
          <span id="current-guesser-name" class="text-xs sm:text-sm font-black text-green-400">Jogador 1</span>
        </div>
      </div>

      <!-- Área do Grid -->
      <div id="grid-container" class="w-full flex-1 flex items-center justify-center min-h-0 relative z-20 pointer-events-none px-2">
        <div id="board-grid"></div>
      </div>

      <!-- Input Transparente para Capturar o Teclado -->
      <input type="text" id="native-keyboard-input" autocomplete="off" autocorrect="off" spellcheck="false" 
        onkeydown="handleKeyDown(event)" oninput="handleNativeInput(this)">

    </div>

  </main>

  <script>
    // Configurações do Jogo
    const targetWord = "TERMO".toUpperCase(); // Palavra secreta (podes alterar a lógica para dinâmica)
    const wordLength = targetWord.length;
    const maxAttempts = 6;

    let currentRow = 0;
    let currentTile = 0;
    let guesses = Array.from({ length: maxAttempts }, () => []);
    let gameOver = false;

    // Inicialização
    function setupBoardGrid() {
      const grid = document.getElementById('board-grid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${wordLength}, minmax(0, 1fr))`;

      for (let r = 0; r < maxAttempts; r++) {
        for (let c = 0; c < wordLength; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;

          tile.innerHTML = `
            <div class="tile-inner">
              <div class="tile-front" style="border: 2px solid #3a3a3c; background-color: #121213; border-radius: 6px;"></div>
            </div>
          `;

          grid.appendChild(tile);
        }
      }

      adjustTileSizes();
      highlightActiveTile();
    }

    // Ajusta o tamanho das células para caber em qualquer ecrã
    function adjustTileSizes() {
      const container = document.getElementById('grid-container');
      if (!container || container.clientHeight === 0) return;

      const gap = 6;
      const padding = 16;

      const availHeight = container.clientHeight - padding;
      const availWidth = container.clientWidth - padding;

      const maxTileHeight = Math.floor((availHeight - ((maxAttempts - 1) * gap)) / maxAttempts);
      const maxTileWidth = Math.floor((availWidth - ((wordLength - 1) * gap)) / wordLength);

      const tileSize = Math.max(28, Math.min(maxTileHeight, maxTileWidth, 62));
      const fontSize = Math.max(14, Math.floor(tileSize * 0.52));

      document.querySelectorAll('.tile').forEach(tile => {
        tile.style.width = `${tileSize}px`;
        tile.style.height = `${tileSize}px`;
      });

      document.querySelectorAll('.tile-front').forEach(el => {
        el.style.fontSize = `${fontSize}px`;
      });
    }

    // Foca o input para abrir o teclado no mobile
    function focusNativeKeyboard() {
      const input = document.getElementById('native-keyboard-input');
      if (input) input.focus();
    }

    // Destaque da célula atual
    function highlightActiveTile() {
      document.querySelectorAll('.tile-front').forEach(el => el.classList.remove('tile-active'));
      if (gameOver || currentRow >= maxAttempts) return;

      const activeTile = document.querySelector(`#tile-${currentRow}-${currentTile} .tile-front`);
      if (activeTile) {
        activeTile.classList.add('tile-active');
      }
    }

    // Gestão do teclado
    function handleKeyDown(e) {
      if (gameOver) return;

      if (e.key === 'Enter') {
        submitGuess();
      } else if (e.key === 'Backspace') {
        deleteLetter();
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        addLetter(e.key.toUpperCase());
      }
    }

    function handleNativeInput(input) {
      const value = input.value;
      if (!value) return;

      const lastChar = value.slice(-1);
      if (/^[a-zA-Z]$/.test(lastChar)) {
        addLetter(lastChar.toUpperCase());
      }
      input.value = '';
    }

    function addLetter(letter) {
      if (currentTile < wordLength && currentRow < maxAttempts) {
        guesses[currentRow][currentTile] = letter;
        const tileFront = document.querySelector(`#tile-${currentRow}-${currentTile} .tile-front`);
        tileFront.textContent = letter;
        tileFront.classList.add('animate-pop');

        if (currentTile < wordLength - 1) {
          currentTile++;
        }
        highlightActiveTile();
      }
    }

    function deleteLetter() {
      if (currentRow >= maxAttempts) return;

      const tileFrontCurrent = document.querySelector(`#tile-${currentRow}-${currentTile} .tile-front`);
      
      if (tileFrontCurrent && tileFrontCurrent.textContent !== '') {
        guesses[currentRow][currentTile] = '';
        tileFrontCurrent.textContent = '';
        tileFrontCurrent.classList.remove('animate-pop');
      } else if (currentTile > 0) {
        currentTile--;
        guesses[currentRow][currentTile] = '';
        const tileFrontPrev = document.querySelector(`#tile-${currentRow}-${currentTile} .tile-front`);
        tileFrontPrev.textContent = '';
        tileFrontPrev.classList.remove('animate-pop');
      }
      highlightActiveTile();
    }

    function submitGuess() {
      const currentGuess = guesses[currentRow].join('');

      if (currentGuess.length !== wordLength) {
        alert('Preencha todas as letras antes de confirmar!');
        return;
      }

      // Validação das cores
      const targetArr = targetWord.split('');
      const guessArr = guesses[currentRow];
      const result = Array(wordLength).fill('absent');

      // 1. Marca os corretos (verdes)
      guessArr.forEach((char, i) => {
        if (char === targetArr[i]) {
          result[i] = 'correct';
          targetArr[i] = null;
        }
      });

      // 2. Marca os presentes (amarelos)
      guessArr.forEach((char, i) => {
        if (result[i] !== 'correct') {
          const targetIndex = targetArr.indexOf(char);
          if (targetIndex !== -1) {
            result[i] = 'present';
            targetArr[targetIndex] = null;
          }
        }
      });

      // Aplicação visual das cores
      result.forEach((status, i) => {
        const tileFront = document.querySelector(`#tile-${currentRow}-${i} .tile-front`);
        tileFront.classList.add(status);
      });

      if (currentGuess === targetWord) {
        gameOver = true;
        setTimeout(() => alert('Parabéns! Adivinhaste a palavra!'), 200);
      } else if (currentRow === maxAttempts - 1) {
        gameOver = true;
        setTimeout(() => alert(`Fim de jogo! A palavra era ${targetWord}`), 200);
      } else {
        currentRow++;
        currentTile = 0;
        highlightActiveTile();
      }
    }

    // Listeners Globais
    window.addEventListener('resize', adjustTileSizes);
    window.addEventListener('DOMContentLoaded', () => {
      setupBoardGrid();
      focusNativeKeyboard();
    });
  </script>
</body>
</html>
